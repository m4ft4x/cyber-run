
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER RUN // M4FT4X</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: #05080d; color: #00ff9c;
  font-family: monospace; text-align: center;
  display: flex; justify-content: center; align-items: center;
  padding: 18px;
}
main { width: 100%; max-width: 650px; }
h1 { letter-spacing: 5px; text-shadow: 0 0 12px #00ff9c; }
p { color: #a4cbbb; }
.panel {
  border: 1px solid #00ff9c; padding: 12px;
  box-shadow: 0 0 18px #00ff9c22;
}
canvas {
  display: block; width: 100%; height: auto;
  background: #080e18; image-rendering: pixelated;
  border: 1px solid #174b43; touch-action: manipulation;
}
button {
  background: #00ff9c; color: #04100b;
  border: 0; padding: 14px 20px; margin: 8px 4px;
  font: bold 15px monospace; cursor: pointer;
}
button:active { transform: scale(.97); }
#status { min-height: 24px; color: #ff4d9d; }
.small { font-size: 12px; color: #78998e; }
</style>
</head>
<body>
<main>
  <h1>CYBER RUN</h1>
  <p>// M4FT4X ARCADE SYSTEM //</p>
  <div class="panel">
    <p>SCORE: <span id="score">0</span>
      &nbsp; | &nbsp; BEST: <span id="best">0</span></p>
    <canvas id="game" width="600" height="280"></canvas>
    <div id="status">SYSTEM READY // TAP START</div>
    <button id="start">▶ START / RESTART</button>
    <button id="jump">▲ JUMP</button>
    <p class="small">TAP JUMP OR TAP THE GAME TO AVOID BLOCKS</p>
  </div>
  <p class="small">[ CONNECTION ESTABLISHED ]</p>
</main>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const statusEl = document.getElementById("status");

let player, obstacles, score, speed, frame, running, ended;
let best = 0;
try {
  best = Number(localStorage.getItem("cyberBest")) || 0;
} catch(e) {}
bestEl.textContent = best;

function reset() {
  player = { x: 65, y: 210, w: 22, h: 28, vy: 0, grounded: true };
  obstacles = [];
  score = 0;
  speed = 4;
  frame = 0;
  running = true;
  ended = false;
  scoreEl.textContent = "0";
  statusEl.textContent = "SYSTEM ONLINE // RUN!";
}

function jump() {
  if (!running) {
    if (ended) reset();
    else reset();
    return;
  }
  if (player.grounded) {
    player.vy = -11;
    player.grounded = false;
  }
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function draw() {
  ctx.clearRect(0, 0, 600, 280);

  // Neon grid
  ctx.strokeStyle = "#102b32";
  ctx.lineWidth = 1;
  for (let x = 0; x <= 600; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 250); ctx.stroke();
  }
  for (let y = 10; y <= 250; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(600, y); ctx.stroke();
  }

  // Ground
  rect(0, 240, 600, 3, "#00ff9c");
  rect(0, 244, 600, 36, "#07130f");

  // Pixel runner
  rect(player.x, player.y, player.w, player.h, "#00ff9c");
  rect(player.x + 5, player.y + 6, 5, 5, "#07130f");
  rect(player.x + 15, player.y + 6, 5, 5, "#07130f");
  rect(player.x + 5, player.y + 19, 13, 3, "#07130f");

  // Obstacles
  obstacles.forEach(o => {
    rect(o.x, o.y, o.w, o.h, "#ff3c86");
    rect(o.x + 4, o.y + 5, 4, 4, "#ffffff");
  });

  if (!running) {
    ctx.fillStyle = "#00ff9c";
    ctx.font = "bold 24px monospace";
    ctx.textAlign = "center";
    ctx.fillText(ended ? "GAME OVER" : "CYBER RUN", 300, 105);
    ctx.font = "14px monospace";
    ctx.fillText(ended ? "TAP RESTART TO TRY AGAIN" : "PRESS START TO PLAY", 300, 135);
  }
}

function endGame() {
  running = false;
  ended = true;
  statusEl.textContent = "SYSTEM FAILED // TRY AGAIN";
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("cyberBest", best); } catch(e) {}
  }
}

function update() {
  if (running) {
    frame++;
    score = Math.floor(frame / 5);
    speed = 4 + Math.min(score / 100, 5);
    scoreEl.textContent = score;

    player.vy += 0.55;
    player.y += player.vy;
    if (player.y + player.h >= 240) {
      player.y = 240 - player.h;
      player.vy = 0;
      player.grounded = true;
    }

    if (frame % Math.max(35, 75 - Math.floor(speed * 3)) === 0) {
      let h = 22 + Math.random() * 22;
      obstacles.push({ x: 600, y: 240 - h, w: 18 + Math.random() * 12, h });
    }

    obstacles.forEach(o => o.x -= speed);
    obstacles = obstacles.filter(o => o.x + o.w > 0);

    for (const o of obstacles) {
      if (player.x < o.x + o.w &&
          player.x + player.w > o.x &&
          player.y < o.y + o.h &&
          player.y + player.h > o.y) {
        endGame();
        break;
      }
    }
  }
  draw();
  requestAnimationFrame(update);
}

document.getElementById("start").addEventListener("click", reset);
document.getElementById("jump").addEventListener("click", jump);
canvas.addEventListener("pointerdown", jump);
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

reset();
update();
</script>
</body>
</html>
